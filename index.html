<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nossa Casa</title>
  <meta name="theme-color" content="#ebeadf">
  <meta name="description" content="A casa que a gente está montando, peça por peça.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icones/apple-180.png">
  <style>
    html, body { margin: 0; height: 100%; background: #ebeadf; overflow: hidden; }
    body { font: 400 15px/1.4 "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #000; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #ebeadf; }
    .abre { position: fixed; inset: 0; display: grid; place-items: center; background: #ebeadf; z-index: 5; transition: opacity .5s ease; }
    .abre.sai { opacity: 0; pointer-events: none; }
    .abre div { display: grid; justify-items: center; gap: 14px; }
    .abre svg { width: 76px; height: 76px; animation: bate 1.6s ease-in-out infinite; }
    .abre b { font-size: 22px; letter-spacing: -.05em; }
    .abre b i { color: #f04923; font-style: normal; }
    .abre p { margin: 0; color: #6b6b6b; font-size: 13.5px; min-height: 1.4em; text-align: center; padding: 0 24px; }
    @keyframes bate { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.06); } }
    .faixa { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 6; background: #000; color: #fff;
      border-radius: 16px; padding: 14px 14px 14px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      box-shadow: 0 10px 30px rgba(0,0,0,.18); max-width: 560px; margin: 0 auto; transform: translateY(140%); transition: transform .35s ease; }
    .faixa.on { transform: none; }
    .faixa p { margin: 0; flex: 1 1 200px; font-size: 14px; }
    .faixa button { border: 0; border-radius: 999px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; }
    .faixa .sim { background: #f04923; color: #fff; }
    .faixa .nao { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
  </style>
</head>
<body>
  <div class="abre" id="abre">
    <div>
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="2" y="2" width="96" height="96" rx="22" fill="#f04923"/><path transform="rotate(-2 58 58)" d="M38.4 48.4H48.8V41.1A14.9 14.9 0 0 1 78.6 41.1V72.9Q78.6 76.4 75.1 76.4H38.4A14.0 14.0 0 0 1 38.4 48.4Z" fill="#ebeadf" stroke="#fff" stroke-width="10.5" stroke-linejoin="round" paint-order="stroke"/></svg>
      <b>nossa casa<i>.</i></b>
      <p id="abreMsg"></p>
    </div>
  </div>

  <iframe id="app" title="Nossa Casa" allow="clipboard-write; fullscreen; web-share"></iframe>

  <div class="faixa" id="faixa" role="dialog" aria-live="polite">
    <p>Receber no celular o resumo das novidades da casa (às 21h, só nos dias com novidade)?</p>
    <button class="nao" id="faixaNao" type="button">Agora não</button>
    <button class="sim" id="faixaSim" type="button">Permitir</button>
  </div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
